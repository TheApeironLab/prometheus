name: Protected application adapter
on:
  pull_request:
    paths: ['deploy/**', 'release/package/**', 'Makefile', '.github/workflows/protected-package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: python -m pip install -r release/package/requirements.txt
      - run: make deployment-test
      - run: git diff --check
