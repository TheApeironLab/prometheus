name: Protected application adapter
on:
  pull_request:
    paths: ['deploy/**', 'release/package/**', 'Makefile', '.github/workflows/protected-package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3
      - run: python -m pip install -r release/package/requirements.txt
      - run: make deployment-test
      - run: git diff --check
