{{- $host := required "site.host required" .Values.site.host -}}
{{- $issuer := required "site.issuerUrl required" .Values.site.issuerUrl -}}
{{- if not (hasPrefix "https://" $issuer) }}{{ fail "OIDC issuer must use HTTPS" }}{{ end -}}
{{- if not .Values.site.allowedGroups }}{{ fail "site.allowedGroups must be explicit" }}{{ end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  prometheus.yml: |
{{ .Values.scrapeConfig | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  {{- if .Values.storage.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations:
        checksum/config: {{ .Values.scrapeConfig | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: {{ required "images.prometheus required" .Values.images.prometheus | quote }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.retention }}
            - --web.listen-address=127.0.0.1:9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec:
              command: [/bin/wget, -Y, "off", -q, -O, /dev/null, 'http://127.0.0.1:9090/-/ready']
          resources: {{ toYaml .Values.resources.prometheus | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
        - name: oauth2-proxy
          image: {{ required "images.oauth2Proxy required" .Values.images.oauth2Proxy | quote }}
          args:
            - --provider=oidc
            {{- if .Values.site.caSecret }}
            - --provider-ca-file=/etc/iam-ca/ca.crt
            - --use-system-trust-store=true
            {{- end }}
            - --oidc-issuer-url={{ $issuer }}
            - --client-id={{ required "site.clientId required" .Values.site.clientId }}
            - --redirect-url=https://{{ $host }}/oauth2/callback
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:9090/
            - --email-domain=*
            - --scope=openid profile email groups
            - --oidc-groups-claim={{ .Values.site.groupsClaim }}
            {{- range .Values.site.allowedGroups }}
            - --allowed-group={{ . }}
            {{- end }}
            - --code-challenge-method=S256
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --reverse-proxy=true
            - --skip-provider-button=true
            - --skip-jwt-bearer-tokens=false
            - --cookie-refresh=5m
            - --cookie-expire=1h
          {{- if .Values.site.caSecret }}
          volumeMounts:
            - {name: iam-ca, mountPath: /etc/iam-ca, readOnly: true}
          {{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ required "site.oidcSecret required" .Values.site.oidcSecret }}, key: client-secret}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.site.oidcSecret }}, key: cookie-secret}
          ports: [{name: http, containerPort: 4180}]
          readinessProbe: {httpGet: {path: /ready, port: http}}
          livenessProbe: {httpGet: {path: /ping, port: http}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toYaml .Values.resources.oauth2Proxy | nindent 12 }}
      volumes:
        {{- if .Values.site.caSecret }}
        - {name: iam-ca, secret: {secretName: {{ .Values.site.caSecret }}}}
        {{- end }}
        - {name: config, configMap: {name: {{ .Release.Name }}-config}}
        - {name: data, persistentVolumeClaim: {claimName: {{ .Release.Name }}-data}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 4180, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  {{- if .Values.ingress.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: {name: http}
