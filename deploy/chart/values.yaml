images:
  prometheus:
    repository: prometheus/prometheus
    tag: v3.16.0
    digest: ''
  oauth2-proxy:
    repository: oauth2-proxy/oauth2-proxy
    tag: v7.15.6
    digest: ''
  query-proxy:
    repository: prometheus/query-proxy
    tag: 0.1.1
    digest: ''
  operator:
    repository: prometheus-operator/prometheus-operator
    tag: v0.95.1
    digest: ''
  config-reloader:
    repository: prometheus-operator/prometheus-config-reloader
    tag: v0.95.1
    digest: ''
imagePullSecrets: []
site:
  host: ''
  issuerUrl: ''
  clientId: ''
  oidcSecret: ''
  allowedGroups: []
  groupsClaim: groups
  caSecret: ''
ingress:
  className: traefik
  clusterIssuer: ''
  tlsSecret: prometheus-tls
storage:
  size: 10Gi
  storageClassName: local-path
  retain: true
retention: 7d
resources:
  prometheus:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  oauth2Proxy:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
networkPolicy:
  enabled: true
  ingressNamespace: kube-system
  ingressPodLabels:
    app.kubernetes.io/name: traefik
  extraEgress: []
  kubernetesApiPort: 6443
vasi:
  imageContract: vasi.images.v1
  complete: true
global:
  imageRegistry: ''
query:
  enabled: false
  authSecret: ''
  tlsSecret: ''
  allowedNamespace: vasi
  allowedPodLabels:
    app.kubernetes.io/name: vasi
    app.kubernetes.io/component: ui
operator:
  version: 0.95.1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
